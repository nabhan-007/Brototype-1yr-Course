<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f4f4f4;
        color: #333;
      }

      .container {
        text-align: center;
        padding: 2rem;
      }

      h1 {
        font-size: 6rem;
        color: #e63946;
      }

      p {
        margin: 1rem 0 2rem;
        font-size: 1.1rem;
        color: #666;
      }

      a {
        display: inline-block;
        text-decoration: none;
        background: #333;
        color: #fff;
        padding: 0.8rem 1.5rem;
        border-radius: 6px;
        transition: background 0.2s ease;
      }

      a:hover {
        background: #555;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>404</h1>
      <p>Oops! The page you're looking for doesn't exist.</p>
      <a href="/">Go Back Home</a>
    </div>
  </body>
</html>
